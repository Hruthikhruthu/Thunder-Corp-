services:
  # MySQL stores ERP domain data and runs schema.sql once for a new volume.
  mysql:
    image: mysql:8.0
    container_name: thundercore-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - thundercore-net
    healthcheck:
      # Backend startup waits for this healthcheck to pass.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Spring Boot backend exposes REST APIs, Swagger, health checks, and STOMP.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thundercore-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME:-test@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-password}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - thundercore-net
    healthcheck:
      # Frontend startup waits for the API to be reachable.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # React/Nginx frontend serves the SPA and proxies /api, /ws, and Swagger.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thundercore-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - thundercore-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql-data:
    driver: local

networks:
  thundercore-net:
    driver: bridge
