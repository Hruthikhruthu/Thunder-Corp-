spring:
  datasource:
    # Docker Compose injects this URL to point at the mysql service.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/thundercore_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Thunder@2025}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Keeps demo deployments self-healing while schema.sql documents the model.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    # Optional SMTP settings for future email notification delivery.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
