spring:
  datasource:
    # H2 runs in MySQL compatibility mode so tests exercise MySQL-like SQL types.
    url: jdbc:h2:mem:thundercore_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Development/test schema is generated from JPA entities.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      # Useful for local inspection during interviews and demos.
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  mail:
    # Mail is optional; notification delivery currently uses persisted rows + STOMP.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:password}
    test-connection: false 
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
