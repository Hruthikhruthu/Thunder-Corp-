spring:
  application:
    name: thundercore-erp
  profiles:
    # Dev uses H2 for local/test runs; Docker sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

jwt:
  # JWT_SECRET should be rotated for production deployments.
  secret: ${JWT_SECRET:4f783b9c025d81a942e6f982348a7b9c45a72b904e1f6d3a82746b1a8d05273f}
  expiration: 86400000 # 1 day

springdoc:
  # Swagger/OpenAPI endpoints are exposed for HR demos and API inspection.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  # Health is used by Docker Compose to gate service startup.
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    com.thundercore.erp: INFO
    org.springframework.security: WARN
